[package]
name = "ag-app"
description = "Agent Governor NG daemons and operator CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ag_app"
path = "src/lib.rs"

[features]
worker-fixture = []

[[bin]]
name = "agd"
path = "src/bin/agd.rs"

[[bin]]
name = "ag-effectd"
path = "src/bin/ag-effectd.rs"

[[bin]]
name = "agctl"
path = "src/bin/agctl.rs"

[[bin]]
name = "ag-worker-fixture"
path = "src/bin/ag-worker-fixture.rs"
required-features = ["worker-fixture"]

[[bin]]
name = "ag-loopctl"
path = "src/bin/ag-loopctl.rs"

[[bin]]
name = "ag-standing-resolver"
path = "src/bin/ag_standing_resolver.rs"

[[bin]]
name = "ag-gcl-v1-glass-heron"
path = "src/bin/ag_gcl_v1_glass_heron.rs"

[dependencies]
ag-campaign = { path = "../ag-campaign" }
ag-effect = { path = "../ag-effect" }
ag-kernel = { path = "../ag-kernel" }
ag-primitives = { path = "../ag-primitives" }
ag-protocol = { path = "../ag-protocol" }
ag-session = { path = "../ag-session" }
ag-store = { path = "../ag-store" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["uio"] }
rand.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
ag-operator-ui = { path = "../ag-operator-ui" }

[lints]
workspace = true
