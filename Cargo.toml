[workspace]
resolver = "2"
members = [
    "crates/ag-app",
    "crates/ag-campaign",
    "crates/ag-effect",
    "crates/ag-kernel",
    "crates/ag-migrate",
    "crates/ag-operator-ui",
    "crates/ag-primitives",
    "crates/ag-protocol",
    "crates/ag-providerd",
    "crates/ag-session",
    "crates/ag-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Agent Governor contributors"]

[workspace.dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
hex = "0.4.3"
http = "=1.4.0"
libc = "0.2.186"
nix = { version = "0.29.0", features = ["fs", "process", "signal", "socket", "user"] }
rand = "0.9.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
ring = "0.17.14"
rusqlite = { version = "0.36.0", features = ["backup", "bundled"] }
rustls = { version = "=0.23.37", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "=1.14.0"
rustls-webpki = "=0.103.9"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
